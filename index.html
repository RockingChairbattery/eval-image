<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chest X-ray image reading study</title>
<style>
  :root{
    --bg:#0c1016; --panel:#131923; --line:#242e3c; --line2:#33404f;
    --ink:#e6ecf3; --ink-dim:#8fa1b5; --ink-faint:#5d6f83;
    --accent:#6fb6c9; --good:#7bc490; --warn:#d9a441; --sev:#c99ae8;
    --r:6px; --hdr:46px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  button:disabled{opacity:.45;cursor:default}

  header{display:flex;align-items:center;gap:12px;height:var(--hdr);padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font-weight:600;font-size:14.5px}
  .spacer{flex:1}
  .who{color:var(--ink-dim);font-size:13px}
  .ghost{background:none;border:1px solid var(--line2);border-radius:var(--r);padding:4px 10px;font-size:13px;color:var(--ink-dim)}
  .ghost:hover{border-color:var(--accent);color:var(--ink)}
  .sync{font-size:12.5px;color:var(--ink-faint);display:inline-flex;align-items:center;gap:7px;padding:3px 10px;
    border:1px solid var(--line);border-radius:20px;white-space:nowrap}
  .sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
  .sync[data-state=ok]{color:var(--good)} .sync[data-state=ok]::before{background:var(--good)}
  .sync[data-state=busy]{color:var(--accent)} .sync[data-state=busy]::before{background:var(--accent)}
  .sync[data-state=queued]{color:var(--warn)} .sync[data-state=queued]::before{background:var(--warn)}
  .sync[data-state=err]{color:#e58a7f;border-color:#5c3733;cursor:pointer} .sync[data-state=err]::before{background:#e58a7f}
  .banner{background:#2a1f14;border:1px solid #5c4526;color:#e0c58a;border-radius:var(--r);padding:11px 14px;margin-bottom:16px;font-size:13.5px}
  .bar{height:3px;background:#1b2431}
  .bar>i{display:block;height:100%;background:var(--accent);transition:width .2s}
  main{padding:12px 18px}

  /* ---------- start page ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 26px;max-width:1180px;margin:0 auto}
  .card h1{font-size:22px;margin:0 0 4px;font-weight:600}
  .lede{color:var(--ink-dim);margin:0;font-size:14px}
  .startrow{display:flex;gap:10px;align-items:center;margin:14px 0 4px;flex-wrap:wrap}
  input[type=text]{background:#0e141d;border:1px solid var(--line2);border-radius:var(--r);color:var(--ink);padding:8px 12px;font:inherit}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
  .primary{background:var(--accent);color:#08222a;border:none;border-radius:var(--r);padding:9px 20px;font-weight:600}
  .primary:hover{filter:brightness(1.08)}
  .exhead{display:flex;align-items:baseline;gap:10px;margin:20px 0 8px;border-top:1px solid var(--line);padding-top:16px}
  .exhead h2{font-size:15px;margin:0;font-weight:600}
  .exhead span{color:var(--ink-faint);font-size:13px}
  .ex{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
  .ex3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .ex3 figure{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0a0e14}
  .ex3 img{display:block;width:100%}
  .ex3 figcaption{font-size:12px;color:var(--ink-dim);padding:4px 8px;border-top:1px solid var(--line)}
  .exq{font-size:13px}
  .exq .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-top:1px solid var(--line)}
  .exq .row:first-child{border-top:none}
  .exq .lab{font-weight:600}
  .exq .look{color:var(--ink-faint);font-size:12px;grid-column:1}
  .exq .ans{grid-row:1/span 2;grid-column:2;align-self:center;text-align:right}
  .exq .ans b{display:inline-block;min-width:34px;text-align:center;background:var(--accent);color:#08222a;border-radius:5px;padding:1px 6px}
  .exq .ans i{display:block;font-style:normal;color:var(--ink-dim);font-size:11.5px;margin-top:2px}
  .exq h4{margin:8px 0 2px;font-size:12px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .fine{color:var(--ink-faint);font-size:12.5px;margin-top:14px}

  /* ---------- reading page (fits one screen on a desktop) ---------- */
  .desc{max-width:1400px;margin-left:auto;margin-right:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--accent);border-radius:var(--r);padding:8px 14px;margin-bottom:10px}
  .desc .lab{color:var(--ink-faint);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .desc .txt{font-size:18px;font-weight:500}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .chip{font-size:12.5px;color:var(--ink-dim);border:1px solid var(--line2);border-radius:14px;padding:2px 10px;white-space:nowrap}
  .chip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
  .stage{display:grid;grid-template-columns:auto minmax(380px,560px);gap:18px;align-items:start;justify-content:center}
  .imgs{display:grid;grid-template-columns:var(--big,560px) var(--small,280px);grid-template-rows:var(--small,280px) var(--small,280px);gap:8px}
  .imgs figure{margin:0;position:relative;background:#000;border:2px solid var(--line);border-radius:8px;overflow:hidden}
  .imgs figure.big{grid-row:1/span 2}
  .imgs figure.on{border-color:var(--accent)}
  .imgs img{display:block;width:100%;height:100%;object-fit:contain;cursor:zoom-in}
  .imgs .cap{position:absolute;left:0;right:0;top:0;padding:5px 9px;font-size:12px;color:#dfe7ef;
    background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0));display:flex;gap:10px;flex-wrap:wrap;align-items:center;pointer-events:none}
  .imgs .cap b{font-weight:600;margin-right:2px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
  .nomask{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-faint);font-size:13px}

  .qs{padding-right:4px;display:flex;flex-direction:column}
  .scalehd{font-size:11.5px;color:var(--ink-faint);margin-bottom:6px}
  .grp{font-size:12px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px;
    display:flex;align-items:center;gap:7px}
  .grp:first-child{margin-top:0}
  .grp .sw{width:10px;height:10px;border-radius:2px}
  .grp .spec{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-dim)}
  .q{display:grid;grid-template-columns:158px minmax(0,1fr);column-gap:10px;align-items:center;
    padding:4px 8px;border-radius:6px;border:1px solid transparent}
  .q.active{border-color:var(--line2);background:#161e2a}
  .q.dim{opacity:.55}
  .q h3{margin:0;font-size:13px;font-weight:600;line-height:1.25}
  .q h3 small{display:block;font-weight:400;color:var(--ink-faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scale{display:flex;gap:4px}
  .scale button{flex:1;background:#0e141d;border:1px solid var(--line2);border-radius:var(--r);padding:4px 0;font-size:13px;
    font-weight:600;color:var(--ink-dim)}
  .scale button:hover{border-color:var(--accent);color:var(--ink)}
  .scale button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#08222a}
  .scale button.na{flex:.8;font-weight:500;font-size:12px}
  .anc{grid-column:2;font-size:11.5px;color:var(--ink-faint);margin-top:3px;display:none;justify-content:space-between;gap:8px}
  .anc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q.active .anc{display:flex}
  .anc .sel{color:var(--ink)}

  .foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .foot .r1{display:flex;gap:8px;align-items:center}
  .foot input[type=text]{flex:1;min-width:0;padding:5px 10px;font-size:13px}
  .foot .r1 .primary{padding:6px 18px}
  .foot .r2{display:flex;gap:8px;align-items:center}
  .foot .count{margin-left:auto;color:var(--ink-faint);font-size:12px;white-space:nowrap}
  .flagbtn[aria-pressed=true]{border-color:var(--warn);color:var(--warn)}
  .missing{color:var(--warn);font-size:12.5px}
  .hint{color:var(--ink-faint);font-size:11.5px;line-height:1.6}
  kbd{background:#0e141d;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;
    font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-dim)}
  .done{text-align:center;padding:50px 20px}

  #zoom{position:fixed;inset:0;background:rgba(5,8,12,.94);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
  #zoom img{width:512px;height:512px;max-width:96vw;max-height:94vh;object-fit:contain}   /* native size, never upscaled */
  #zoom .lab{position:fixed;top:12px;left:16px;color:var(--ink-dim);font-size:13px}
  @media (max-width:1000px){
    .stage{grid-template-columns:1fr}
    .ex{grid-template-columns:1fr}
    header{padding:0 12px;gap:8px}
    main{padding:12px}
    .brand{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">Image reading study</div>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
  <span class="sync" id="sync" title="connection to the results sheet"></span>
  <button class="ghost" id="btn-help">Scoring guide</button>
  <button class="ghost" id="btn-save">Download a copy</button>
</header>
<div class="bar"><i id="prog" style="width:0"></i></div>
<main id="main"></main>
<div id="zoom"><span class="lab" id="zoomlab"></span><img id="zoomimg" alt=""></div>

<script>
/* ============================================================ config */
/* Apps Script web app /exec URL (see apps_script.gs). Leave empty to run offline (results stay in this browser). */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbz4mgpPgJCGtq26rct2qnzCbzl70wMI38Q0kj7dUucqheGn3TNthhkSdMA9NXVFmrv47g/exec";

const SCALE = [1, 2, 3, 4, 5];                 // every question: 5 = best / most consistent
const fmt = v => v === "NA" ? "N/A" : String(v);

/* view = the image the question is about (that panel is highlighted while the question is active) */
const IMG_Q = [
  { key:"realism", title:"Realistic?", view:"img",
    ask:"Does the radiograph itself look like a real chest X-ray? Judge the image, not the overlays.",
    anchors:["Definitely synthetic","Probably synthetic","Cannot tell","Probably real","Definitely real"] },
  { key:"anatomy", title:"Anatomy overlay fits?", view:"anat",
    ask:"Do the anatomy overlays (lung, heart, mediastinum contours; ribs shaded) follow the structures on the radiograph?",
    anchors:["Grossly wrong","Clearly off in several places","Roughly right, obvious local errors","Accurate, minor deviations","Accurate everywhere"] },
];
/* normal cases only; stored in the "abnormal" column, but 5 = definitely normal (= consistent with the description) */
const NORMAL_Q = { key:"abnormal", title:"Normal, as described?", view:"img",
  ask:"The description says this radiograph is normal. Is it free of abnormality?",
  anchors:["Definitely abnormal","Probably abnormal","Equivocal","Probably normal","Definitely normal"] };
const F_Q = [
  { key:"vis", title:"Visible?", view:"img",
    ask:f => `Is ${f.name.toLowerCase()} visible on the radiograph?`,
    anchors:["Not visible","Probably not visible","Equivocal","Probably visible","Clearly visible"] },
  { key:"loc", title:"Location matches?", na:true, view:"img",
    ask:f => `Is it where the description says (${f.location || "—"})?`,
    anchors:["Wrong side or region","Right side, wrong zone","Overlaps, centred elsewhere","Small deviation","Exactly as described"] },
  { key:"sev", title:"Severity matches?", na:true, view:"img",
    ask:f => `Does its severity / extent match the description (“${f.modifier || "—"}”)?`,
    anchors:["Very different","Clearly different","Somewhat different","Close","Exactly as described"] },
  { key:"mask", title:"Mask fits?", view:"lesion",
    ask:f => `Does the coloured mask match the visible ${f.name.toLowerCase()}?`,
    anchors:["Misplaced / nothing under it","Covers a small part","Roughly right, clearly off in size or position","Good, minor boundary errors","Exact"] },
];

const SHEET_COLS = ["evaluator_id","evaluator_name","sample_id","n_findings","prompt","realism","anatomy","abnormal",
  "f1_name","f1_vis","f1_loc","f1_sev","f1_mask","f2_name","f2_vis","f2_loc","f2_sev","f2_mask",
  "flag","note","time_spent_sec","review_started_at","review_submitted_at","updated_at"];

const LS = k => "imgeval_v2_" + k;          // v2: 1-5 scale (v1 used -2..+2)
const iso = () => new Date().toISOString();
const ANAT_LEGEND = `<span><i style="background:#50c8ff"></i>Lungs</span><span><i style="background:#ff6ec8"></i>Heart</span>
  <span><i style="background:#ffd75a"></i>Mediastinum</span><span><i style="background:#beffa0"></i>Ribs</span>`;

/* ============================================================ state */
let ITEMS = [], BY_UID = {}, ORDER = [], cur = 0, res = {}, focus = 0, QLIST = [];
let evaluatorName = "", evaluatorId = "";
let outbox = [], sending = false, sendTimer = null, lastOk = null, lastErr = "", tPanel = 0;
const normId = n => n.trim().toLowerCase().replace(/\s+/g, " ");

/* questions of one item, in display order: [{id, key, fi, def}] (fi = finding index or -1) */
function questions(it){
  const qs = IMG_Q.map(d => ({ id:d.key, fi:-1, def:d }));
  if (!it.findings.length) qs.push({ id:NORMAL_Q.key, fi:-1, def:NORMAL_Q });
  it.findings.forEach((f, i) => F_Q.forEach(d => qs.push({ id:`f${i+1}_${d.key}`, fi:i, def:d })));
  return qs;
}
/* a question that the description does not support is fixed to N/A (and not shown) */
function fixedNA(it, q){
  if (q.fi < 0) return false;
  const f = it.findings[q.fi];
  return (q.def.key === "loc" && !f.location) || (q.def.key === "sev" && !f.modifier);
}

function seededShuffle(arr, seedStr){
  let h = 2166136261;
  for (const c of seedStr){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h<<13; h ^= h>>>17; h ^= h<<5; return ((h>>>0) % 100000) / 100000; };
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

async function boot(){
  ITEMS = (await (await fetch("items.json")).json()).items;
  ITEMS.forEach(it => BY_UID[it.uid] = it);
  evaluatorName = localStorage.getItem(LS("ename")) || "";
  evaluatorId = evaluatorName ? normId(evaluatorName) : "";
  res = JSON.parse(localStorage.getItem(LS("res")) || "{}");
  outbox = JSON.parse(localStorage.getItem(LS("outbox")) || "[]");
  paintSync();
  setInterval(flush, 15000);
  window.addEventListener("online", flush);
  window.addEventListener("beforeunload", e => { if (outbox.length){ e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("resize", fitStage);
  flush();
  if (evaluatorName){ start(evaluatorName); pullRemote().then(n => { if (n) render(); }).catch(() => {}); }
  else screenStart();
}

/* ============================================================ sheet sync */
function rowFor(uid){
  const r = res[uid] || {}, it = BY_UID[uid] || { findings:[] };
  const v = k => (r[k] === undefined ? "" : r[k]);
  const row = { evaluator_id:evaluatorId, evaluator_name:evaluatorName, sample_id:uid, n_findings:it.findings.length,
    prompt:it.prompt || "", realism:v("realism"), anatomy:v("anatomy"), abnormal:v("abnormal"),
    flag:r.flag ? 1 : "", note:r.note || "", time_spent_sec:r.time_spent_sec || "",
    review_started_at:r.review_started_at || "", review_submitted_at:r.review_submitted_at || "", updated_at:r.updated_at || "" };
  [0,1].forEach(i => {
    const f = it.findings[i];
    row[`f${i+1}_name`] = f ? f.name : "";
    F_Q.forEach(d => row[`f${i+1}_${d.key}`] = f ? v(`f${i+1}_${d.key}`) : "");
  });
  return row;
}

function queue(uid){
  if (!ENDPOINT) return;
  outbox = outbox.filter(x => !(x.sample_id === uid && x.evaluator_id === evaluatorId));
  outbox.push(rowFor(uid));
  localStorage.setItem(LS("outbox"), JSON.stringify(outbox));
  paintSync();
  clearTimeout(sendTimer);
  sendTimer = setTimeout(() => { sendTimer = null; flush(); }, 900);
}

async function flush(){
  if (!ENDPOINT || sending || !outbox.length) return;
  sending = true; paintSync("busy");
  try {
    while (outbox.length){
      const url = ENDPOINT + "?action=write&data=" + encodeURIComponent(JSON.stringify(outbox[0]));
      const out = await (await fetch(url)).json();
      if (out.status !== "ok") throw new Error(out.message || "endpoint did not answer status:ok");
      outbox.shift();
      localStorage.setItem(LS("outbox"), JSON.stringify(outbox));
      lastOk = new Date(); lastErr = "";
    }
  } catch (err) {
    lastErr = String(err.message || err);
  } finally {
    sending = false; paintSync();
    if (outbox.length && !sendTimer) sendTimer = setTimeout(() => { sendTimer = null; flush(); }, 8000);
  }
}

const parseScore = s => {
  const t = String(s ?? "").trim();
  if (t === "NA") return "NA";
  if (t === "") return undefined;
  const n = Number(t);
  return SCALE.includes(n) ? n : undefined;
};

async function pullRemote(){
  if (!ENDPOINT || !evaluatorId) return 0;
  paintSync("busy");
  const out = await (await fetch(ENDPOINT + "?action=read&evaluator_id=" + encodeURIComponent(evaluatorId))).json();
  if (out.status !== "ok") throw new Error(out.message || "endpoint did not answer status:ok");
  const remote = {};
  let restored = 0;
  (out.rows || []).forEach(row => {
    const uid = String(row.sample_id || "").trim();
    if (!uid || !BY_UID[uid]) return;
    remote[uid] = row;
    const mine = res[uid] || {};
    if ((mine.updated_at || "") >= (row.updated_at || "")) return;
    const rec = { uid, flag: ["1","true","TRUE"].includes(String(row.flag)), note: row.note || "",
      time_spent_sec: parseFloat(row.time_spent_sec) || 0, review_started_at: row.review_started_at || "",
      review_submitted_at: row.review_submitted_at || "", updated_at: row.updated_at || "" };
    questions(BY_UID[uid]).forEach(q => { const s = parseScore(row[q.id]); if (s !== undefined) rec[q.id] = s; });
    res[uid] = rec; restored++;
  });
  localStorage.setItem(LS("res"), JSON.stringify(res));
  lastOk = new Date(); lastErr = "";
  ITEMS.forEach(it => {                       // anything newer on this device goes back into the queue
    const r = res[it.uid];
    if (!r || !questions(it).some(q => r[q.id] !== undefined)) return;
    const rt = remote[it.uid];
    if (rt && (rt.updated_at || "") >= (r.updated_at || "")) return;
    outbox = outbox.filter(x => !(x.sample_id === it.uid && x.evaluator_id === evaluatorId));
    outbox.push(rowFor(it.uid));
  });
  localStorage.setItem(LS("outbox"), JSON.stringify(outbox));
  paintSync(); flush();
  return restored;
}

function paintSync(force){
  const el = document.getElementById("sync");
  el.title = lastErr || "connection to the results sheet";
  if (!ENDPOINT){ el.dataset.state = ""; el.textContent = "Saved on this device"; return; }
  if (force === "busy"){ el.dataset.state = "busy"; el.textContent = "Saving…"; return; }
  if (lastErr && outbox.length){ el.dataset.state = "err"; el.textContent = "Not saving · " + outbox.length + " held · details"; return; }
  if (outbox.length){ el.dataset.state = "queued"; el.textContent = outbox.length + " waiting to save"; return; }
  el.dataset.state = "ok";
  el.textContent = lastOk ? "Saved " + lastOk.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "Connected";
}
document.getElementById("sync").onclick = async () => {
  if (!ENDPOINT) return;
  lastErr = ""; paintSync("busy"); await flush();
  alert(lastErr ? "Scores are not reaching the spreadsheet.\n\n" + lastErr + "\n\nNothing is lost — " + outbox.length
      + " cases are held on this device and will upload once the endpoint answers. Leave this tab open."
    : "Connection is fine. Everything scored so far is in the spreadsheet.");
};

/* ============================================================ start page */
function rubricHTML(){
  const tbl = (d, sev) => `<table class="${sev ? "sev" : ""}"><tbody>${d.anchors.map((a,i) =>
    `<tr><td>${fmt(SCALE[i])}</td><td>${a}</td></tr>`).join("")}</tbody></table>`;
  const ask = d => typeof d.ask === "function" ? d.ask({ name:"the finding", location:"…", modifier:"…" }) : d.ask;
  return `<h1 style="font-size:20px">Scoring guide</h1><p>Every question: 1 = worst, 5 = best / most consistent.</p>
    <h2>Whole image</h2>
    ${IMG_Q.map(d => `<h3>${d.title}</h3><p>${ask(d)}</p>${tbl(d)}`).join("")}
    <h3>${NORMAL_Q.title} <span style="font-weight:400;color:#8fa1b5">(normal cases only)</span></h3><p>${NORMAL_Q.ask}</p>${tbl(NORMAL_Q)}
    <h2>Each finding of the description</h2>
    ${F_Q.map(d => `<h3>${d.title}</h3><p>${ask(d)}
      ${d.na ? " Skipped when the description gives no " + (d.key === "loc" ? "location" : "severity") + "; N/A when the finding is not visible." : ""}</p>${tbl(d)}`).join("")}`;
}

/* worked example: a real ChestX-Det case that is not one of the study cases */
const EXAMPLE = {
  prompt:"moderate left basal pleural effusion",
  rows:[
    { grp:"Whole image" },
    { lab:"Realistic?", look:"Radiograph — judge the image, not the overlays", v:4, why:"Probably real" },
    { lab:"Anatomy overlay fits?", look:"Anatomy panel", v:4, why:"Accurate, minor deviations" },
    { grp:"Effusion · moderate · left basal" },
    { lab:"Visible?", look:"Radiograph", v:5, why:"Clearly visible" },
    { lab:"Location matches?", look:"Left basal?", v:5, why:"Exactly as described" },
    { lab:"Severity matches?", look:"Moderate?", v:5, why:"Exactly as described" },
    { lab:"Mask fits?", look:"Findings panel", v:4, why:"Good, minor boundary errors" },
  ]};

function screenStart(){
  const ex = EXAMPLE.rows.map(r => r.grp ? `<h4>${r.grp}</h4>` :
    `<div class="row"><span class="lab">${r.lab}</span><span class="ans"><b>${r.v}</b><i>${r.why}</i></span>
      <span class="look">${r.look}</span></div>`).join("");
  document.getElementById("main").innerHTML = `
  <div class="card">
    <h1>Rate ${ITEMS.length} chest radiographs</h1>
    <p class="lede">Each case shows a text description, the radiograph, and two overlays. Score each question from <b>1</b> (worst) to <b>5</b>
      (best / most consistent) — about 30 s per case. Some images and masks are real, some are generated by a model; they are mixed and shuffled.</p>
    <div class="startrow">
      <input type="text" id="ename" placeholder="Your name" value="${evaluatorName}" style="width:240px">
      <button class="primary" id="go">Begin</button>
      <span class="lede" id="start-msg"></span>
    </div>
    <div class="exhead"><h2>Example</h2><span>not part of the study · description: “${EXAMPLE.prompt}”</span></div>
    <div class="ex">
      <div class="ex3">
        <figure><img src="example/img.png" alt="example radiograph"><figcaption>Radiograph</figcaption></figure>
        <figure><img src="example/anat.png" alt="example anatomy overlay"><figcaption>Anatomy</figcaption></figure>
        <figure><img src="example/lesion.png" alt="example finding mask"><figcaption>Findings</figcaption></figure>
      </div>
      <div class="exq">${ex}</div>
    </div>
    <p class="fine">Hover a score button to see its definition; “Scoring guide” (top right) lists all of them.
      Normal cases ask “Normal, as described?” instead of the finding questions. Re-entering the same name resumes where you left off, on any computer.</p>
  </div>`;
  const go = async () => {
    const nm = document.getElementById("ename").value.trim();
    if (!nm){ document.getElementById("ename").focus(); return; }
    const btn = document.getElementById("go"), msg = document.getElementById("start-msg");
    evaluatorName = nm; evaluatorId = normId(nm);
    btn.disabled = true; btn.textContent = "Checking…";
    let restored = 0, failed = false;
    try { restored = await pullRemote(); } catch (err){ failed = true; }
    btn.disabled = false; btn.textContent = "Begin";
    if (failed){
      msg.textContent = "Could not reach the spreadsheet just now — scores are held on this device and upload once it answers.";
      setTimeout(() => start(nm), 2000);
    } else { if (restored) msg.textContent = "Picked up " + restored + " cases you scored earlier."; start(nm); }
  };
  document.getElementById("go").onclick = go;
  document.getElementById("ename").onkeydown = e => { if (e.key === "Enter") go(); };
}

function start(name){
  evaluatorName = name; evaluatorId = normId(name);
  localStorage.setItem(LS("ename"), evaluatorName);
  outbox.forEach(r => { r.evaluator_id = evaluatorId; r.evaluator_name = evaluatorName; });
  localStorage.setItem(LS("outbox"), JSON.stringify(outbox));
  ORDER = seededShuffle(ITEMS.map((_,i) => i), evaluatorId);
  document.getElementById("who").textContent = evaluatorName;
  cur = firstUnrated(); render();
}

const answered = (r, q) => r[q.id] !== undefined;
function complete(uid){ const it = BY_UID[uid], r = res[uid]; return !!r && questions(it).every(q => answered(r, q)); }
const doneCount = () => ITEMS.filter(it => complete(it.uid)).length;
function firstUnrated(){ for (let i=0;i<ORDER.length;i++) if (!complete(ITEMS[ORDER[i]].uid)) return i; return ORDER.length; }

/* ============================================================ reading page */
function scaleHTML(it, q, r){
  const d = q.def, val = r[q.id];
  const btns = SCALE.map((v, i) => `<button data-q="${q.id}" data-v="${v}" title="${v}: ${d.anchors[i]}" aria-pressed="${val === v}">${v}</button>`).join("")
    + (d.na ? `<button class="na" data-q="${q.id}" data-v="NA" aria-pressed="${val === "NA"}" title="not applicable">N/A</button>` : "");
  const sel = (val !== undefined && val !== "NA") ? `<span class="sel">${val}: ${d.anchors[SCALE.indexOf(val)]}</span>`
    : val === "NA" ? `<span class="sel">N/A</span>` : `<span>1 ${d.anchors[0]}</span><span>5 ${d.anchors[4]}</span>`;
  return `<div class="scale">${btns}</div><div class="anc">${sel}</div>`;   // .anc shows only on the active question
}

function qHTML(it, q, r, idx){
  const d = q.def, f = q.fi >= 0 ? it.findings[q.fi] : null;
  const ask = typeof d.ask === "function" ? d.ask(f) : d.ask;
  const hint = f ? (d.key === "loc" ? f.location : d.key === "sev" ? f.modifier : "") : "";
  const dim = (d.key === "loc" || d.key === "sev") && r[q.id] === "NA" && typeof r[`f${q.fi+1}_vis`] === "number" && r[`f${q.fi+1}_vis`] <= 2;
  return `<div class="q ${idx === focus ? "active" : ""} ${dim ? "dim" : ""}" data-idx="${idx}" title="${ask.replace(/"/g, "&quot;")}">
    <h3>${d.title}${hint ? `<small>${hint}</small>` : ""}</h3>${scaleHTML(it, q, r)}</div>`;
}

function imgsHTML(it){
  const legend = it.findings.map(f => `<span class="legend"><i style="background:${f.color}"></i>${f.name}</span>`).join("");
  return `<div class="imgs" id="imgs">
    <figure class="big" data-view="img"><img src="${it.img}" data-lab="Radiograph" alt="radiograph"><div class="cap"><b>Radiograph</b></div></figure>
    <figure data-view="anat"><img src="${it.anat}" data-lab="Anatomy" alt="anatomy overlay"><div class="cap"><b>Anatomy</b>${ANAT_LEGEND.replace(/<span>/g, '<span class="legend">')}</div></figure>
    <figure data-view="lesion">${it.lesion ? `<img src="${it.lesion}" data-lab="Findings" alt="finding masks"><div class="cap"><b>Findings</b>${legend}</div>`
      : `<div class="nomask">Normal case: no finding mask</div>`}</figure></div>`;
}

function markPanel(){
  const v = QLIST[focus] && QLIST[focus].def.view;
  document.querySelectorAll(".imgs figure").forEach(f => f.classList.toggle("on", f.dataset.view === v));
}

/* big radiograph + two half-size overlays stacked beside it, sized to fit the window; never above native 512 px */
const MAXPX = 512;
function fitStage(){
  const d = document.querySelector(".desc"), st = document.querySelector(".stage"); if (!d || !st) return;
  const top = st.getBoundingClientRect().top + window.scrollY;
  const availH = window.innerHeight - top - 14;
  const availW = document.querySelector("main").clientWidth - 36 - 14 - 400 - 8;
  if (window.innerWidth <= 1000){                       // narrow screens: stack everything
    const w = document.querySelector("main").clientWidth - 24;
    const B = Math.min(MAXPX, Math.floor(w * 2 / 3) - Math.floor(w * 2 / 3) % 2);
    document.documentElement.style.setProperty("--big", B + "px");
    document.documentElement.style.setProperty("--small", (B / 2 - 4) + "px");
    return;
  }
  let H = Math.floor(Math.min(availH, availW / 1.5, MAXPX));
  H = Math.max(H, 360); H -= H % 2;
  document.documentElement.style.setProperty("--big", (H + 4) + "px");          // + 2 px border each side: image itself is H x H
  document.documentElement.style.setProperty("--small", ((H + 4) / 2 - 4) + "px");
}

function render(){
  if (!ORDER.length) return;
  if (cur >= ORDER.length) return screenDone();
  const it = ITEMS[ORDER[cur]];
  const r = res[it.uid] || (res[it.uid] = { uid: it.uid });
  QLIST = questions(it);
  QLIST.forEach(q => { if (fixedNA(it, q) && r[q.id] === undefined) r[q.id] = "NA"; });
  if (!r.review_started_at){ r.review_started_at = iso(); }
  localStorage.setItem(LS("res"), JSON.stringify(res));
  tPanel = performance.now();
  focus = QLIST.findIndex(q => !answered(r, q) && !fixedNA(it, q)); if (focus < 0) focus = 0;
  document.getElementById("prog").style.width = (100*cur/ORDER.length) + "%";

  const chips = it.findings.map(f => `<span class="chip"><i style="background:${f.color}"></i>${[f.name, f.modifier, f.location].filter(Boolean).join(" · ")}</span>`).join("");
  let qs = "", lastGrp = null;
  QLIST.forEach((q, idx) => {
    if (fixedNA(it, q)) return;                      // nothing to judge: stored as N/A, not shown
    const grp = q.fi < 0 ? -1 : q.fi;
    if (grp !== lastGrp){
      lastGrp = grp;
      if (grp < 0) qs += `<div class="grp">Whole image</div>`;
      else { const f = it.findings[grp];
        qs += `<div class="grp"><span class="sw" style="background:${f.color}"></span>${f.name}
          <span class="spec">${[f.modifier, f.location].filter(Boolean).join(" · ")}</span></div>`; }
    }
    qs += qHTML(it, q, r, idx);
  });

  document.getElementById("main").innerHTML = `
    <div class="desc"><span class="lab">Description</span><span class="txt">${it.prompt}</span><span class="chips">${chips}</span></div>
    <div class="stage">
      ${imgsHTML(it)}
      <div class="qs">
        <div class="scalehd">1 = worst · 5 = best / most consistent</div>
        <div id="qlist">${qs}</div>
        <div class="foot">
          <div class="r1"><button class="ghost flagbtn" id="flag" aria-pressed="${!!r.flag}">Flag</button>
            <input type="text" id="note" placeholder="Optional note" value="${(r.note || "").replace(/"/g, "&quot;")}">
            <button class="ghost" id="prev">Back</button><button class="primary" id="next">Next</button></div>
          <div class="r2"><span class="hint"><kbd>1</kbd>–<kbd>5</kbd> score · <kbd>0</kbd> N/A · <kbd>↑</kbd><kbd>↓</kbd> question ·
            <kbd>Enter</kbd> next · click an overlay to view at full size</span><span class="missing" id="missing"></span>
            <span class="count">${cur+1} / ${ORDER.length} · ${doneCount()} done</span></div>
        </div>
      </div>
    </div>`;
  fitStage();
  bindQs(); markPanel();
  document.querySelectorAll(".imgs img").forEach(im => im.onclick = () => zoom(im.src, im.dataset.lab));
  document.getElementById("flag").onclick = e => {
    const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", on); store(it.uid, { flag: on });
  };
  document.getElementById("note").onchange = e => store(it.uid, { note: e.target.value });
  document.getElementById("prev").onclick = () => { if (cur > 0){ cur--; render(); } };
  document.getElementById("next").onclick = next;
  preload(cur + 1);
}

function bindQs(){
  document.querySelectorAll(".scale button").forEach(b => b.onclick = () =>
    setScore(b.dataset.q, b.dataset.v === "NA" ? "NA" : +b.dataset.v));
}

function visibleIdx(){ const it = ITEMS[ORDER[cur]]; return QLIST.map((q, i) => i).filter(i => !fixedNA(it, QLIST[i])); }

function next(){
  const it = ITEMS[ORDER[cur]], r = res[it.uid] || {};
  const miss = QLIST.filter(q => !answered(r, q));
  if (miss.length){
    document.getElementById("missing").textContent = miss.length + " not answered";
    focus = QLIST.indexOf(miss[0]); paintFocus(); return;
  }
  cur++; render();
}

function preload(i){
  if (i >= ORDER.length) return;
  const it = ITEMS[ORDER[i]];
  [it.img, it.anat, it.lesion].filter(Boolean).forEach(s => { const im = new Image(); im.src = s; });
}

function setScore(qid, val){
  const it = ITEMS[ORDER[cur]];
  const patch = { [qid]: val };
  /* finding judged not visible (1-2) -> location and severity become N/A (still editable) */
  const m = /^f(\d)_vis$/.exec(qid);
  if (m && typeof val === "number" && val <= 2){
    ["loc", "sev"].forEach(k => { const id = `f${m[1]}_${k}`; const q = QLIST.find(q => q.id === id); if (q && !fixedNA(it, q)) patch[id] = "NA"; });
  }
  store(it.uid, patch);
  const r = res[it.uid];
  QLIST.forEach((q, idx) => {
    if (!(q.id in patch) && !(m && q.fi === +m[1] - 1)) return;
    const el = document.querySelector(`.q[data-idx="${idx}"]`);
    if (el) el.outerHTML = qHTML(it, q, r, idx);
  });
  bindQs();
  document.getElementById("missing").textContent = "";
  const vis = visibleIdx(), here = QLIST.findIndex(x => x.id === qid);
  const nxt = vis.find(i => i > here && !answered(r, QLIST[i]));
  const any = vis.find(i => !answered(r, QLIST[i]));
  focus = nxt !== undefined ? nxt : (any !== undefined ? any : here);
  paintFocus();
  document.querySelector(".count").textContent = `${cur+1} / ${ORDER.length} · ${doneCount()} done`;
}

function paintFocus(){
  document.querySelectorAll(".q").forEach(q => q.classList.toggle("active", +q.dataset.idx === focus));
  markPanel();
  const el = document.querySelector(`.q[data-idx="${focus}"]`);
  if (el) el.scrollIntoView({ block:"nearest", behavior:"smooth" });
}

function store(uid, patch){
  const now = performance.now();
  const spent = Math.min(120, Math.max(0, (now - tPanel) / 1000));
  tPanel = now;
  const prev = res[uid] || {};
  res[uid] = Object.assign({ uid }, prev, patch, {
    time_spent_sec: +((prev.time_spent_sec || 0) + spent).toFixed(1),
    review_started_at: prev.review_started_at || iso(), review_submitted_at: iso(), updated_at: iso() });
  localStorage.setItem(LS("res"), JSON.stringify(res));
  queue(uid);
}

function zoom(src, lab){
  document.getElementById("zoomimg").src = src;
  document.getElementById("zoomlab").textContent = lab + " — click or Esc to close";
  document.getElementById("zoom").style.display = "flex";
}
document.getElementById("zoom").onclick = () => document.getElementById("zoom").style.display = "none";

function screenDone(){
  document.getElementById("prog").style.width = "100%";
  const pending = outbox.length;
  document.getElementById("main").innerHTML = `
  <div class="card done">
    <h1>All ${ORDER.length} cases scored</h1>
    ${ENDPOINT && pending ? `<div class="banner">${pending} case${pending > 1 ? "s" : ""} still waiting to reach the spreadsheet.
      Keep this tab open on a working connection, or press Send now.</div>` : ""}
    <p class="lede" style="margin:0 auto 22px">${ENDPOINT ? (pending ? "Everything else is already in the study spreadsheet."
      : "Everything is in the study spreadsheet — you can close the tab.") : "Download the results file and send it to the study coordinator."}</p>
    ${ENDPOINT ? `<button class="primary" id="send">Send now</button>` : ""}
    <button class="${ENDPOINT ? "ghost" : "primary"}" id="dl" style="margin-left:10px">Download a copy</button>
    <button class="ghost" id="rev" style="margin-left:10px">Review from the start</button>
  </div>`;
  document.getElementById("dl").onclick = download;
  document.getElementById("rev").onclick = () => { cur = 0; render(); };
  const sb = document.getElementById("send");
  if (sb) sb.onclick = async () => { await flush(); screenDone(); };
}

function download(){
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [SHEET_COLS.join(",")];
  ORDER.forEach(ix => {
    const it = ITEMS[ix], r = res[it.uid];
    if (!r || !questions(it).some(q => r[q.id] !== undefined)) return;
    const o = rowFor(it.uid);
    rows.push(SHEET_COLS.map(c => cell(o[c])).join(","));
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([rows.join("\n")], { type:"text/csv" }));
  a.download = `imgeval_${evaluatorId || "reader"}_${iso().slice(0,10)}.csv`;
  a.click();
}

document.getElementById("btn-save").onclick = download;
document.getElementById("btn-help").onclick = () => {
  const w = window.open("", "_blank");
  w.document.write(`<title>Scoring guide</title><style>body{font:15px/1.6 ui-sans-serif,system-ui;max-width:48rem;margin:40px auto;
    padding:0 20px;background:#0c1016;color:#e6ecf3}h2{font-size:16px;margin-top:26px}h3{font-size:14.5px;margin:16px 0 2px}
    table{width:100%;border-collapse:collapse;font-size:13.5px}td{border:1px solid #242e3c;padding:5px 10px}
    td:first-child{width:52px;text-align:center;color:#6fb6c9;font-weight:600}.sev td:first-child{color:#c99ae8}p{color:#8fa1b5;margin:2px 0 6px}</style>` + rubricHTML());
  w.document.close();
};

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape"){ document.getElementById("zoom").style.display = "none"; return; }
  if (!ORDER.length || cur >= ORDER.length || !QLIST.length) return;
  const q = QLIST[focus], vis = visibleIdx(), p = vis.indexOf(focus);
  if (e.key >= "1" && e.key <= "5"){ setScore(q.id, SCALE[+e.key - 1]); e.preventDefault(); }
  else if (e.key === "0"){ if (q.def.na) setScore(q.id, "NA"); e.preventDefault(); }
  else if (e.key === "ArrowDown"){ focus = vis[(p + 1) % vis.length]; paintFocus(); e.preventDefault(); }
  else if (e.key === "ArrowUp"){ focus = vis[(p + vis.length - 1) % vis.length]; paintFocus(); e.preventDefault(); }
  else if (e.key === "Enter"){ next(); }
  else if (e.key === "Backspace"){ if (cur > 0){ cur--; render(); } e.preventDefault(); }
  else if (e.key.toLowerCase() === "f"){ const f = document.getElementById("flag"); if (f) f.click(); }
});

boot();
</script>
</body>
</html>
